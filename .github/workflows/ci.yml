name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} / Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MSVC
            os: windows-2022
            generator: Visual Studio 17 2022
          - compiler: GCC 14
            os: ubuntu-24.04
            generator: Ninja Multi-Config
            cc: gcc-14
            cxx: g++-14
          - compiler: Clang 18
            os: ubuntu-24.04
            generator: Ninja Multi-Config
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_GENERATOR: ${{ matrix.generator }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Conan
        run: python -m pip install conan==2.29.0

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install C++ dependencies
        run: |
          conan install . --build=missing -s:h build_type=Release -s:h compiler.cppstd=20 `
            -c:h "tools.cmake.cmaketoolchain:generator=$env:CMAKE_GENERATOR" `
            -c:h "tools.cmake.cmaketoolchain:user_presets="

      - name: Configure
        run: |
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=generators/conan_toolchain.cmake" `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
